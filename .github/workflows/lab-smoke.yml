name: Lab Kafka smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-kafka-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kafka-smoke:
    name: Three-broker KRaft smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Docker Compose
        run: docker compose version

      - name: Start the Kafka cluster
        run: docker compose up -d --wait --wait-timeout 240

      - name: Verify replication and message delivery
        run: bash scripts/smoke-test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the Kafka cluster
        if: always()
        run: docker compose down --volumes --remove-orphans

  ground-truth:
    name: Ground-truth recorder build and Kafka verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GROUND_TRUTH_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      GROUND_TRUTH_TOPIC: recoveryguard-ground-truth-${{ github.run_id }}-${{ github.run_attempt }}
      GROUND_TRUTH_OUTPUT: /tmp/recoveryguard-ground-truth

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ground-truth/pom.xml

      - name: Check Docker Compose
        run: docker compose version

      - name: Start the Kafka test cluster
        run: docker compose up -d --wait --wait-timeout 240

      - name: Build and test ground-truth module
        run: mvn --batch-mode --no-transfer-progress -f ground-truth/pom.xml clean verify

      - name: Create isolated test topic
        run: |
          docker compose exec -T kafka-1 /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka-1:19092 \
            --create \
            --topic "$GROUND_TRUTH_TOPIC" \
            --partitions 3 \
            --replication-factor 3 \
            --config min.insync.replicas=2 \
            --config cleanup.policy=delete \
            --config retention.ms=3600000

      - name: Create independent evidence run
        run: |
          java -jar ground-truth/target/ground-truth-0.1.0-SNAPSHOT.jar create \
            --output-dir "$GROUND_TRUTH_OUTPUT/runs" \
            --run-id "$GROUND_TRUTH_RUN_ID" \
            --topic "$GROUND_TRUTH_TOPIC" \
            --bootstrap-servers localhost:29092 \
            --description "CI producer and record-verifier integration test"

      - name: Produce acknowledged records
        run: |
          java -jar ground-truth/target/ground-truth-0.1.0-SNAPSHOT.jar produce \
            --output-dir "$GROUND_TRUTH_OUTPUT/runs" \
            --run-id "$GROUND_TRUTH_RUN_ID" \
            --count 200 \
            --payload-bytes 256

      - name: Verify Kafka records against the external ledger
        run: |
          java -jar ground-truth/target/ground-truth-0.1.0-SNAPSHOT.jar verify \
            --output-dir "$GROUND_TRUTH_OUTPUT/runs" \
            --run-id "$GROUND_TRUTH_RUN_ID" \
            --report "$GROUND_TRUTH_OUTPUT/reports/$GROUND_TRUTH_RUN_ID.json" \
            --timeout-ms 60000
          jq -e '.status == "PASS" and .confirmedWrites == 200 and .preservedWrites == 200' \
            "$GROUND_TRUTH_OUTPUT/reports/$GROUND_TRUTH_RUN_ID.json"

      - name: Show Kafka logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the Kafka test cluster
        if: always()
        run: docker compose down --volumes --remove-orphans
